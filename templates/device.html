{% extends "base.html" %}
{% block title %}设备状态 · 多模态采集上位机{% endblock %}
{% block content %}
<h1 class="page-title">设备状态</h1>
<div class="device-page">
    <section class="panel">
        <div class="panel-head">
            <h2>通讯模块</h2>
            <button class="btn btn-ghost btn-sm" id="refreshBtn">刷新</button>
        </div>
        <div class="panel-body">
            <div class="module-grid" id="moduleGrid"></div>
        </div>
    </section>

    <section class="panel" style="margin-top:16px">
        <div class="panel-head"><h2>通讯配置</h2></div>
        <div class="panel-body">
            <form id="connForm">
                <div class="form-row">
                    <label>通讯方式</label>
                    <select name="link">
                        <option value="USB-CDC">USB-CDC (有线)</option>
                        <option value="BLE">BLE (无线)</option>
                    </select>
                </div>
                <div class="form-row">
                    <label>USB 端口</label>
                    <select name="port"><option>COM3</option><option>COM4</option><option>自动检测</option></select>
                </div>
                <div class="form-row">
                    <label>波特率</label>
                    <input type="number" name="baudrate" value="115200">
                </div>
                <button type="submit" class="btn btn-primary">连接</button>
            </form>
        </div>
    </section>
</div>

<script>
async function loadModules() {
    const r = await fetch('/api/device/info');
    const d = await r.json();
    const grid = document.getElementById('moduleGrid');
    grid.innerHTML = `
        <div class="module-card">
            <div class="mc-title">
                <span>${d.mcu || 'STM32F407'}</span>
                <span class="badge badge-success"><span class="status-dot green"></span> 已连接</span>
            </div>
            <div class="metric-row"><span class="metric-label">固件版本</span><span class="metric-value">${d.firmware || 'v1.0.0'}</span></div>
            <div class="metric-row"><span class="metric-label">硬件版本</span><span class="metric-value">${d.hw_revision || 'REV-A'}</span></div>
            <div class="metric-row"><span class="metric-label">连接方式</span><span class="metric-value">${d.link || 'USB-CDC'}</span></div>
            <div class="metric-row"><span class="metric-label">采样率</span><span class="metric-value">${d.sample_rate || 250} Hz</span></div>
            <div class="metric-row"><span class="metric-label">电压</span><span class="metric-value">${d.voltage || '3.3'} V</span></div>
            <div class="metric-row"><span class="metric-label">温度</span><span class="metric-value">${d.temperature || '25'} °C</span></div>
        </div>
    `;
}
loadModules();
document.getElementById('refreshBtn').addEventListener('click', loadModules);
document.getElementById('connForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const fd = new FormData(e.target);
    await fetch('/api/device/config', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(Object.fromEntries(fd))
    });
    alert('配置已下发');
    loadModules();
});
</script>
{% endblock %}
