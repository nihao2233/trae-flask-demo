{% extends "base.html" %}
{% block title %}压电波形 · 多模态采集上位机{% endblock %}
{% block content %}
<h1 class="page-title">压电波形 (PVDF)</h1>
<div class="piezo-page">
    <section class="panel">
        <div class="panel-head">
            <h2>2 路 PVDF 信号</h2>
            <div class="head-actions">
                <label style="font-size:var(--font-small);color:var(--text-secondary)">灵敏度 1:
                    <input type="number" value="1.0" step="0.1" style="width:70px;padding:4px;border:1px solid var(--border-default);border-radius:4px"> mV/N
                </label>
                <label style="font-size:var(--font-small);color:var(--text-secondary)">灵敏度 2:
                    <input type="number" value="1.0" step="0.1" style="width:70px;padding:4px;border:1px solid var(--border-default);border-radius:4px"> mV/N
                </label>
                <button class="btn btn-primary btn-sm">应用到设备</button>
            </div>
        </div>
        <div class="wave-container">
            <canvas id="piezoBig1" width="1000" height="200"></canvas>
            <canvas id="piezoBig2" width="1000" height="200" style="margin-top:16px"></canvas>
        </div>
    </section>

    <section class="panel" style="margin-top:16px">
        <div class="panel-head"><h2>历史记录</h2></div>
        <div class="panel-body">
            <table class="data-table" id="piezoRecords">
                <thead><tr><th>文件名</th><th>时长</th><th>采样率</th><th>大小</th><th>操作</th></tr></thead>
                <tbody><tr><td colspan="5" style="text-align:center;color:var(--text-tertiary)">暂无记录</td></tr></tbody>
            </table>
        </div>
    </section>
</div>

<script>
const CH_COLORS = ['#6355FF', '#1B6FF9'];
function drawWave(canvas, ch) {
    const ctx = canvas.getContext('2d');
    const w = canvas.width, h = canvas.height;
    ctx.clearRect(0, 0, w, h);
    ctx.strokeStyle = getComputedStyle(document.body).getPropertyValue('--wave-grid');
    ctx.lineWidth = 1;
    for (let i = 0; i <= 10; i++) { ctx.beginPath(); ctx.moveTo(i*w/10,0); ctx.lineTo(i*w/10,h); ctx.stroke(); }
    const data = globalState.piezo[ch];
    if (data.length < 2) return;
    const baseY = h / 2;
    ctx.strokeStyle = CH_COLORS[ch];
    ctx.lineWidth = 2;
    ctx.beginPath();
    data.forEach((v, i) => {
        const x = (i / MAX_POINTS) * w;
        const y = baseY - v * h * 0.4;
        i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    });
    ctx.stroke();
}

function onSample() {
    drawWave(document.getElementById('piezoBig1'), 0);
    drawWave(document.getElementById('piezoBig2'), 1);
}
</script>
{% endblock %}
