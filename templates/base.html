<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}多模态采集板上位机{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v=2">
    <script>
        // 尽早读取 localStorage 设置主题，并用 MutationObserver 防止被 HMR 等外部代码重置
        (function() {
            function applySaved() {
                var saved = localStorage.getItem('theme');
                if (saved === 'dark' || saved === 'light') {
                    document.documentElement.setAttribute('data-theme', saved);
                }
            }
            applySaved();
            // 监听 data-theme 属性变化，如果被外部重置且与 localStorage 不一致则恢复
            new MutationObserver(function() {
                var current = document.documentElement.getAttribute('data-theme');
                var stored = localStorage.getItem('theme');
                if (stored && current !== stored) {
                    document.documentElement.setAttribute('data-theme', stored);
                }
            }).observe(document.documentElement, {
                attributes: true,
                attributeFilter: ['data-theme']
            });
        })();
    </script>
</head>
<body>
    <!-- 顶栏 56px -->
    <header class="app-header">
        <div class="brand">
            <div class="logo-mark">M</div>
            <div class="brand-text">
                <span class="brand-name">多模态采集上位机</span>
                <span class="brand-sub">ECG × 压阻矩阵 × PVDF</span>
            </div>
        </div>
        <div class="header-status">
            <div class="status-pill" id="connPill">
                <span class="dot"></span>
                <span class="conn-text">已连接</span>
                <span class="conn-sr">250Hz</span>
            </div>
        </div>
        <div class="header-actions">
            <button class="icon-btn" id="themeToggle" title="切换主题">☀</button>
            <button class="icon-btn" title="设置">⚙</button>
            <button class="icon-btn" title="帮助">?</button>
        </div>
    </header>

    <div class="app-body">
        <!-- 左侧导航 -->
        <aside class="app-sidebar">
            <nav class="side-nav">
                {% for item in nav %}
                <a href="{{ url_for(item.id + '_page') if item.id != 'index' else url_for('index') }}"
                   class="nav-item {% if item.active %}active{% endif %}">
                    <span class="nav-icon">{{ nav_icons.get(item.id, '■') }}</span>
                    <span class="nav-label">{{ item.label }}</span>
                </a>
                {% endfor %}
            </nav>
            <div class="sidebar-foot">
                <span class="ver">v1.1.0</span>
            </div>
        </aside>

        <!-- 主内容区 -->
        <main class="app-main">
            {% block content %}{% endblock %}
        </main>
    </div>

    <!-- 底栏 64px -->
    <footer class="app-footer">
        <div class="footer-left">
            <span class="link-tag" id="linkTag">● USB-CDC</span>
            <span class="device-name">设备: WF24-v1.0</span>
        </div>
        <div class="footer-center">
            <button class="foot-btn primary" id="recBtn">● 记录</button>
            <button class="foot-btn" id="startBtn">▶ 开始</button>
            <button class="foot-btn" id="stopBtn">■ 停止</button>
        </div>
        <div class="footer-right">
            <button class="foot-btn" id="exportCsvBtn">导出 CSV</button>
            <button class="foot-btn" id="exportPngBtn">导出 PNG</button>
        </div>
    </footer>

    <!-- 主题切换：内联脚本，不依赖 main.js，确保所有页面都能切换 -->
    <script>
        (function() {
            var btn = document.getElementById('themeToggle');
            if (!btn) return;
            var html = document.documentElement;
            // 同步按钮图标
            var cur = html.getAttribute('data-theme') || 'light';
            btn.textContent = cur === 'dark' ? '☾' : '☀';
            btn.addEventListener('click', function() {
                var c = html.getAttribute('data-theme');
                var n = c === 'dark' ? 'light' : 'dark';
                // 先更新 localStorage，再设置 data-theme，避免 MutationObserver 拦截
                try { localStorage.setItem('theme', n); } catch(e) {}
                html.setAttribute('data-theme', n);
                btn.textContent = n === 'dark' ? '☾' : '☀';
                // 触发 canvas 重绘
                if (typeof onSample === 'function') { try { onSample(); } catch(e){} }
            });
        })();
    </script>
    <script src="{{ url_for('static', filename='js/main.js') }}?v=3"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
