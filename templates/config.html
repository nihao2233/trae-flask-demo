{% extends "base.html" %}
{% block title %}参数配置 · 多模态采集上位机{% endblock %}
{% block content %}
<h1 class="page-title">参数配置</h1>
<div class="config-page">
    <section class="panel">
        <div class="panel-head"><h2>采集参数</h2></div>
        <div class="panel-body">
            <form id="configForm">
                <div class="form-row">
                    <label>采样率 (Hz)</label>
                    <input type="number" name="sample_rate" min="100" max="2000" step="50" value="250">
                </div>
                <div class="form-row">
                    <label>ECG 通道数</label>
                    <input type="number" name="ecg_channels" min="1" max="4" value="4" disabled>
                </div>
                <div class="form-row">
                    <label>矩阵使能</label>
                    <input type="checkbox" name="matrix_enabled" checked>
                </div>
                <div class="form-row">
                    <label>压电通道数</label>
                    <input type="number" name="piezo_channels" min="1" max="2" value="2" disabled>
                </div>
                <div class="form-row">
                    <label>滤波窗口</label>
                    <input type="number" name="filter_window" min="1" max="20" value="5">
                </div>
                <button type="submit" class="btn btn-primary">下发配置</button>
            </form>
        </div>
    </section>

    <section class="panel" style="margin-top:16px">
        <div class="panel-head"><h2>通道映射 (4×4)</h2></div>
        <div class="panel-body">
            <table class="data-table">
                <thead><tr><th>显示位置</th><th>原始通道</th></tr></thead>
                <tbody id="mapBody"></tbody>
            </table>
            <button class="btn btn-ghost btn-sm" style="margin-top:12px" onclick="resetMapping()">恢复默认</button>
        </div>
    </section>
</div>

<script>
const tbody = document.getElementById('mapBody');
const positions = [['(0,0)','(0,1)','(0,2)','(0,3)'],['(1,0)','(1,1)','(1,2)','(1,3)'],['(2,0)','(2,1)','(2,2)','(2,3)'],['(3,0)','(3,1)','(3,2)','(3,3)']];
for (let i = 0; i < 16; i++) {
    const tr = document.createElement('tr');
    const r = Math.floor(i/4), c = i%4;
    tr.innerHTML = `<td>${positions[r][c]}</td><td><select style="padding:4px;border:1px solid var(--border-default);border-radius:4px">${Array.from({length:16},(_,j)=>`<option value="${j}" ${j===i?'selected':''}>CH${j+1}</option>`).join('')}</select></td>`;
    tbody.appendChild(tr);
}
function resetMapping() {
    document.querySelectorAll('#mapBody select').forEach((s, i) => s.value = i);
}
document.getElementById('configForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    alert('配置已下发到设备');
});
</script>
{% endblock %}
