{% extends "base.html" %}
{% block title %}记录回放 · 多模态采集上位机{% endblock %}
{% block content %}
<h1 class="page-title">记录回放</h1>
<div class="replay-page">
    <section class="panel">
        <div class="panel-head"><h2>记录文件</h2></div>
        <div class="panel-body record-list">
            <table class="data-table" id="recordTable">
                <thead><tr><th>文件名</th><th>创建时间</th><th>时长</th><th>大小</th><th>操作</th></tr></thead>
                <tbody id="recordBody"><tr><td colspan="5" style="text-align:center;color:var(--text-tertiary)">加载中...</td></tr></tbody>
            </table>
        </div>
    </section>

    <section class="panel" style="margin-top:16px">
        <div class="panel-head"><h2>回放控制</h2></div>
        <div class="panel-body">
            <div class="replay-controls">
                <button class="btn btn-ghost btn-sm">⏮</button>
                <button class="btn btn-primary">▶ 播放</button>
                <button class="btn btn-ghost btn-sm">⏸</button>
                <button class="btn btn-ghost btn-sm">⏹</button>
                <span style="color:var(--text-tertiary);font-family:monospace" id="replayTime">00:00 / 00:00</span>
                <input type="range" min="0" max="100" value="0" style="flex:1" id="replayProgress">
                <select class="playback-select">
                    <option>1x</option><option>0.5x</option><option>2x</option>
                </select>
            </div>
            <canvas id="replayWave" width="1000" height="200" style="width:100%;background:var(--bg-primary);border-radius:8px;margin-top:16px"></canvas>
        </div>
    </section>
</div>

<script>
async function loadRecords() {
    const r = await fetch('/api/records');
    const d = await r.json();
    const tbody = document.getElementById('recordBody');
    if (d.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:var(--text-tertiary)">暂无记录</td></tr>';
        return;
    }
    tbody.innerHTML = d.map(f => `
        <tr>
            <td>${f.filename}</td>
            <td>${f.modified || '-'}</td>
            <td>${f.duration || '-'}</td>
            <td>${f.size || '-'}</td>
            <td>
                <button class="btn btn-primary btn-sm" onclick="playFile('${f.filename}')">回放</button>
                <button class="btn btn-ghost btn-sm" onclick="downloadFile('${f.filename}')">下载</button>
                <button class="btn btn-ghost btn-sm" onclick="deleteFile('${f.filename}')">删除</button>
            </td>
        </tr>
    `).join('');
}
loadRecords();

function playFile(fn) { alert(`回放 ${fn}`); }
function downloadFile(fn) { window.open(`/data/${fn}`, '_blank'); }
async function deleteFile(fn) {
    if (!confirm(`删除 ${fn}？`)) return;
    await fetch('/api/records/delete', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ filename: fn })
    });
    loadRecords();
}
</script>
{% endblock %}
