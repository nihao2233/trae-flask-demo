[project]
name = "mac-pcq"
version = "0.1.0"
description = "多模态采集板上位机软件（PySide6 / asyncio / 自研协议）"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "myhongliang" },
]
dependencies = [
    # 桌面框架
    "PySide6>=6.6",
    "qasync>=0.27",
    # 图表
    "pyqtgraph>=0.13",
    # 通讯
    "pyserial-asyncio>=0.6",
    # BLE（本轮 stub，硬件到位后启用）
    # "bleak>=0.21",
    # 数值算法
    "numpy>=1.26",
    "scipy>=1.11",
    # HDF5（本轮 stub）
    # "h5py>=3.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
mac-pcq = "mac_pcq.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"mac_pcq.ui.resources" = ["*.qss", "*.ts", "*.qm", "icons/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"